name: ClawGold

# Scoped to the clawgold/ subtree so it stays out of the way of the
# Tirelo Services workflows in this same repository.
on:
  push:
    branches: ['**']
    paths:
      - 'clawgold/**'
      - '.github/workflows/clawgold.yml'
  pull_request:
    paths:
      - 'clawgold/**'
      - '.github/workflows/clawgold.yml'

defaults:
  run:
    working-directory: clawgold

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clawgold/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt omits MetaTrader5, which is Windows-only and
        # cannot install here. The paper broker covers execution instead.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the system imports without MetaTrader5
        # Guards the regression this abstraction exists to prevent: a
        # module-level `import MetaTrader5` makes the whole system
        # unimportable on Linux.
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import broker, instrument, mt5_manager, risk_manager
          import advanced_trader, claw_gold, trading_graph, orchestrator
          assert 'MetaTrader5' not in sys.modules, 'MetaTrader5 was imported eagerly'
          print('all modules import cleanly on Linux')
          "

      - name: Confirm the shipped config does not trade live
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import yaml
          from broker import resolve_mode
          cfg = yaml.safe_load(open('config.yaml'))
          assert resolve_mode(cfg) == 'paper', 'config.yaml would trade live'
          assert not cfg['mt5']['login'], 'an MT5 login is committed'
          assert cfg['telegram']['chat_id'] == '', 'a Telegram chat_id is committed'
          assert not any(cfg['signal_service']['channels'].values()), 'signal channel IDs are committed'
          print('config defaults are safe')
          "

      - name: Confirm the shipped config cannot spend money
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import yaml
          from free_mode import FreeMode
          free = FreeMode.from_config(yaml.safe_load(open('config.yaml')))
          assert free.enabled, 'free mode is off in the committed config'
          assert not free.allow_paid_llm_fallback, 'billed LLM fallback is permitted'
          print('free mode is on; no paid service can be called')
          "

      - name: Run tests
        # run_tests.py loads modules by path. Plain `unittest discover -s test`
        # can pick up CPython's own stdlib `test` package instead and report a
        # pass for a suite that never ran.
        run: python run_tests.py

      - name: Config validates
        run: python claw.py validate

      - name: Preflight passes
        # The same gate the container entrypoint applies, so a change that
        # would fail at deploy time fails here instead.
        run: python claw.py preflight

      - name: Entry budget is achievable
        run: python claw.py entry-check --price 2650

      - name: MT5 bridge round-trips without MetaTrader5
        # The bridge is how macOS and Linux trade live. This proves the
        # client/server pair works on a host where MetaTrader5 cannot be
        # installed, which is exactly the situation it exists for.
        run: python run_tests.py mt5_bridge -v

  container:
    name: Container build and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the entrypoint
        run: bash -n clawgold/docker/entrypoint.sh

      - name: Validate the compose file
        run: docker compose -f clawgold/docker-compose.yml config --quiet

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: clawgold
          push: false
          load: true
          tags: clawgold:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs preflight and the CLI
        run: |
          docker run --rm clawgold:ci python claw.py preflight
          docker run --rm clawgold:ci python claw.py entry-check --price 2650

      - name: Image cannot import MetaTrader5
        # The image must not pretend it can trade live.
        run: |
          docker run --rm -e PREFLIGHT_SKIP=true clawgold:ci python -c "
          import sys
          try:
              import MetaTrader5
              sys.exit('MetaTrader5 must not be installed in this image')
          except ImportError:
              print('correct: MetaTrader5 absent, image is paper-only')
          "

      - name: Image does not run as root
        run: |
          uid=$(docker run --rm -e PREFLIGHT_SKIP=true clawgold:ci id -u)
          test "$uid" != "0" || { echo "container runs as root"; exit 1; }
          echo "runs as uid $uid"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clawgold/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Measure coverage of the risk-critical modules
        run: |
          python -m coverage run --source=scripts run_tests.py
          python -m coverage report -m --include='scripts/instrument.py,scripts/broker.py,scripts/risk_manager.py,scripts/trading_graph.py'
