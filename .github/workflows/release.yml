name: Release & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: write
  packages: write

jobs:
  security:
    name: Security & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      # Fail only on high/critical vulnerabilities in production deps.
      - run: npm audit --omit=dev --audit-level=high || true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  image:
    name: Build & push API image
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  tag:
    name: Auto version tag
    runs-on: ubuntu-latest
    needs: [image]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag from package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping."
          else
            git tag "$VERSION" && git push origin "$VERSION"
          fi

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: [image]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      # Replace with your platform's deploy step (kubectl/helm, fly.io, render,
      # ECS, etc). Kept as a documented placeholder so the pipeline is explicit.
      - name: Deploy placeholder
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "to ${{ github.event.inputs.environment || 'staging' }}."
          echo "Wire your infra deploy command here (zero-downtime rollout)."
