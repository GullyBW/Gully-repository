name: Native builds

# Heavy platform builds — run on demand or for version tags, not every push.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - run: npm ci
      - run: npx ng build --configuration production
      - run: npm i -D @capacitor/cli && npm i @capacitor/android
      - run: npx cap add android
      - run: npx cap sync android
      # Generate icons/splash if a master SVG is present.
      - run: npm i -D @capacitor/assets && npx capacitor-assets generate --android || true

      # Release signing: provide these repo secrets to sign; otherwise builds debug.
      - name: Decode keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  ios:
    name: iOS (archive)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: mobile/package-lock.json }

      - run: npm ci
      - run: npx ng build --configuration production
      - run: npm i -D @capacitor/cli && npm i @capacitor/ios
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: npm i -D @capacitor/assets && npx capacitor-assets generate --ios || true

      # Unsigned build to validate the project compiles. Real distribution needs
      # signing certs/provisioning profiles (configure via fastlane / Xcode cloud).
      - name: Build (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build
