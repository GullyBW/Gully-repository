# Horizontal scaling: 3 → 12 replicas on CPU pressure, with a stabilised scale-down.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: njtip-app
  namespace: njtip-independent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: njtip-app
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
