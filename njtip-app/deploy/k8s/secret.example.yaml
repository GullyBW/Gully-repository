# SHAPE ONLY — do NOT commit real secrets. In production, replace this whole object with an
# ExternalSecret (External Secrets Operator) or a sealed-secret sourced from Vault/KMS, so
# secret material never touches Git. 🔒 KMS/HSM key custody is human-managed, not stored here.
apiVersion: v1
kind: Secret
metadata:
  name: njtip-secrets
  namespace: njtip-independent
  labels: { app.kubernetes.io/name: njtip-app }
type: Opaque
stringData:
  # Placeholders — injected from the secrets manager at deploy time.
  NJTIP_SESSION_SECRET: "REPLACE_FROM_SECRETS_MANAGER"
  NJTIP_OIDC_SECRET: "REPLACE_FROM_SECRETS_MANAGER_OR_USE_JWKS"
  DB_PASSWORD: "REPLACE_FROM_SECRETS_MANAGER"
