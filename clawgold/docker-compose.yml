# ClawGold deployment stack.
#
#   docker compose up -d research           # news + sentiment worker
#   docker compose up -d trader             # the paper trading loop
#   docker compose --profile ui up -d       # add the dashboard
#
# The previous stack had a "db" service: an alpine container that touched
# an empty file and then slept forever, purely to own a volume. SQLite is
# an in-process library, not a server — it needs no container, only a
# shared volume, which is what `clawgold_data` is.
#
# NOTE: none of these services can trade live. MetaTrader5 is Windows-only
# and is not in the image. See docs/DEPLOYMENT.md for the live path.

x-clawgold-common: &clawgold-common
  build:
    context: .
    dockerfile: Dockerfile
  image: clawgold:latest
  # env_file is optional: a fresh clone has no .env, and a hard reference
  # would stop the stack from starting at all.
  env_file:
    - path: .env
      required: false
  volumes:
    - clawgold_data:/app/data
    - clawgold_logs:/app/logs
  restart: unless-stopped
  # SIGTERM reaches the worker, which finishes its cycle and exits. The
  # grace period is generous enough for an in-flight research call.
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # Research only: aggregates news and sentiment into data/news.db.
  # Needs no broker account and is safe to leave running.
  research:
    <<: *clawgold-common
    container_name: clawgold-research
    command: ["python", "scripts/news_worker.py"]
    environment:
      RESEARCH_SYMBOL: ${RESEARCH_SYMBOL:-XAUUSD}
      RESEARCH_INTERVAL_SECONDS: ${RESEARCH_INTERVAL_SECONDS:-1800}
      RESEARCH_USE_AI: ${RESEARCH_USE_AI:-true}
      NEWS_DB_PATH: /app/data/news.db
      # The research worker publishes no heartbeat; the healthcheck falls
      # back to verifying the application imports.
      HEARTBEAT_PATH: /app/data/research-heartbeat.json

  # The trading loop. Paper by default — set TRADING_MODE=real in .env
  # only after reading docs/DEPLOYMENT.md.
  trader:
    <<: *clawgold-common
    container_name: clawgold-trader
    command: ["python", "scripts/trade_worker.py"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-simulation}
      TRADE_SYMBOL: ${TRADE_SYMBOL:-XAUUSD}
      TRADE_INTERVAL_SECONDS: ${TRADE_INTERVAL_SECONDS:-300}
      ENTRY_BUDGET: ${ENTRY_BUDGET:-10.0}
      LEVERAGE: ${LEVERAGE:-500}
      FREE_MODE: ${FREE_MODE:-true}
      HEARTBEAT_PATH: /app/data/heartbeat.json
      HEARTBEAT_MAX_AGE: ${HEARTBEAT_MAX_AGE:-900}
      # Refuse to start on a config that cannot trade.
      PREFLIGHT_STRICT: ${PREFLIGHT_STRICT:-false}

  # Read-only view of the news database. Opt in with --profile ui, since
  # it exposes a port and most deployments do not want that by default.
  dashboard:
    <<: *clawgold-common
    container_name: clawgold-dashboard
    profiles: ["ui"]
    command:
      - streamlit
      - run
      - scripts/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      NEWS_DB_PATH: /app/data/news.db
      # Streamlit is not a worker and publishes no heartbeat.
      PREFLIGHT_SKIP: "true"
    ports:
      # Bound to localhost: the dashboard has no authentication, so
      # publishing it on 0.0.0.0 would expose your trading data to the
      # network. Put it behind a reverse proxy with auth to expose it.
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  clawgold_data:
  clawgold_logs:
