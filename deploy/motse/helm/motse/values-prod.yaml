# Production: canaried releases (5% → 50% → 100%, doc §16) via the CD
# pipeline; automated rollback on SLO burn.
replicas: 3
autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 20, targetCPUUtilization: 65 }
ingress: { enabled: true, host: api.motse.bw, className: gce }
config:
  NODE_ENV: production
  MOTSE_LOG_LEVEL: info
  MOTSE_RATE_CAPACITY: "300"
  MOTSE_RATE_REFILL: "5"
