# Prometheus scrape config for Tirelo Services.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tirelo-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['api:4000']

  # Optional exporters (add to docker-compose.monitoring.yml as needed):
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
